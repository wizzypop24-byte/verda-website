<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Health Supplements</title>
    <meta name="description" content="Sign in with Google to manage your orders and subscriptions." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="auth-title">
        <div class="brand" aria-hidden="true">●</div>
        <h1 id="auth-title">Welcome back</h1>
        <p class="sub">Sign in to track orders, reorder faster and manage your subscriptions.</p>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <!-- Signed out -->
        <div id="signed-out">
          <button id="google-btn" class="btn btn-google" type="button">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.5c-.3 2-1.7 5.1-4.8 7.1l7.5 5.8c4.4-4.1 6.9-10.1 6.9-16.6z"/>
              <path fill="#FBBC05" d="M10.4 28.7A14.6 14.6 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/>
              <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.5-5.8c-2 1.4-4.8 2.4-8.5 2.4-6.4 0-11.7-3.7-13.6-8.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <p class="legal">
            Guest checkout stays available. By continuing you agree to our
            <a href="#">Terms</a> and <a href="#">Privacy Policy</a>. For adults 18+.
          </p>
          <a class="back" href="/">← Back to store</a>
        </div>

        <!-- Signed in -->
        <div id="signed-in" hidden>
          <img id="user-photo" class="avatar" alt="" width="64" height="64" referrerpolicy="no-referrer" />
          <p class="name" id="user-name"></p>
          <p class="email" id="user-email"></p>
          <dl class="meta">
            <div><dt>Provider</dt><dd id="user-provider"></dd></div>
            <div><dt>User ID</dt><dd id="user-uid" class="mono"></dd></div>
          </dl>
          <a class="btn btn-primary" href="/">Continue to store</a>
          <button id="signout-btn" class="btn btn-ghost" type="button" style="margin-top:8px">Sign out</button>
        </div>
      </section>

      <p class="foot">Project <span class="mono">fir-479b9</span> · Firebase Authentication</p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
